[project]
name = "langchain-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rkeuni0i", email = "rkdms1090@naver.com" }
]
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "fastapi>=0.162.0",
    "langchain>=1.4.6",
    "langchain-google-genai>=4.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
langchain-tutorial = "langchain_tutorial:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
