# 로컬 개발용 PostgreSQL. 실행: docker compose up -d
# .env 예: DATABASE_URL=postgresql://postgres:postgres@localhost:5432/chatbot
services:
  postgres:
    image: postgres:16
    container_name: chatbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot
    ports:
      - "5432:5432"
    volumes:
      - chatbot-pgdata:/var/lib/postgresql/data

volumes:
  chatbot-pgdata:

